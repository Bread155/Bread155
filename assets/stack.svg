<svg xmlns="http://www.w3.org/2000/svg" width="590" height="360" viewBox="0 0 590 360">
<defs>
  <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
  <radialGradient id="glow" cx=".35" cy=".4" r=".7"><stop offset="0" stop-color="#ffb000" stop-opacity=".09"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity=".35"/></pattern>
  <filter id="ph" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="scr"><rect x="18" y="18" width="554" height="324" rx="26"/></clipPath>
  <style>
    text{font-family:'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace;white-space:pre}
    .t{font-size:15px;fill:#ffb000} .d{fill:#8f6300} .w{fill:#ffe2a0}
    .in{opacity:0;animation:in .05s forwards} @keyframes in{to{opacity:1}}
    .cur{animation:bl 1s steps(1) infinite} @keyframes bl{50%{opacity:0}}
    .flick{animation:fl 5s infinite} @keyframes fl{0%,100%{opacity:1}48%{opacity:1}49%{opacity:.82}50%{opacity:1}93%{opacity:1}94%{opacity:.9}}
    .roll{animation:roll 7s linear infinite} @keyframes roll{from{transform:translateY(-80px)}to{transform:translateY(360px)}}
    .bar{fill:#ffb000;animation:fill 1.2s ease-out forwards;transform-box:fill-box;transform:scaleX(0)} @keyframes fill{to{transform:scaleX(1)}}
  </style>
</defs>
<rect width="590" height="360" rx="34" fill="#16120b"/>
<rect x="6" y="6" width="578" height="348" rx="30" fill="#1f1910" stroke="#2c2416"/>
<g clip-path="url(#scr)"><rect x="18" y="18" width="554" height="324" fill="#0d0a05"/><rect x="18" y="18" width="554" height="324" fill="url(#glow)"/>
<g class="flick" filter="url(#ph)">
  <text x="50" y="64" class="t"><tspan class="d">aung@kuching:~$</tspan> <tspan class="w">lsmod --mine</tspan></text>
  <line x1="50" y1="76" x2="540" y2="76" stroke="#8f6300" stroke-dasharray="3 4"/>
  <text x="50" y="100" class="t in" style="animation-delay:0.20s"><tspan class='d'>[frontend]</tspan> next.js react typescript tailwind</text><text x="50" y="125" class="t in" style="animation-delay:0.32s"><tspan class='d'>[backend ]</tspan> python fastapi node supabase</text><text x="50" y="150" class="t in" style="animation-delay:0.44s"><tspan class='d'>[data    ]</tspan> postgresql sqlite</text><text x="50" y="175" class="t in" style="animation-delay:0.56s"><tspan class='d'>[desktop ]</tspan> electron</text><text x="50" y="200" class="t in" style="animation-delay:0.68s"><tspan class='d'>[infra   ]</tspan> vercel render cloudflare-r2</text><text x="50" y="225" class="t in" style="animation-delay:0.80s"><tspan class='d'>[systems ]</tspan> c++ linux cisco-networking</text><text x="50" y="250" class="t in" style="animation-delay:0.92s"></text><text x="50" y="275" class="t in" style="animation-delay:1.04s"><tspan class='d'>6 modules loaded · 0 errors</tspan></text>
</g><rect x="18" y="18" width="554" height="324" fill="url(#scan)"/>
<rect class="roll" x="18" y="0" width="554" height="60" fill="#ffb000" fill-opacity=".04"/>
<rect x="18" y="18" width="554" height="324" fill="url(#vig)"/></g>
<rect x="18.5" y="18.5" width="553" height="323" rx="26" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="2"/>
</svg>